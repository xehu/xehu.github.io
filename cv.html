            <iframe class="embed-doc" scrolling="no" src="https://docs.google.com/document/d/e/2PACX-1vSY0CfswGIq9QDYlNr8NFALmQNOURObYsEbFiwhuGakpeT5Yy8A8kQ-3izqJJU-oHNhofDVyS-vlrfS/pub?embedded=true"></iframe>

    <script>
    // The document is 816px wide by nature: a 624px text column plus 96px of
    // padding each side. It is never scaled -- text always renders at its own
    // size -- so the page reads as a document rather than a zoomed image, and
    // once the window fits all 816px, widening only widens the grey margins.
    //
    // Narrower than that the document reflows, and its own side padding is
    // what gives: the iframe is pulled outward so part of that padding falls
    // outside the wrapper and is clipped. On a phone most of it goes, leaving
    // the text the room it needs; as the frame grows the padding eases back
    // until, at 816px, the document is showing its natural margins in full.
    //
    // Sizing the frame to the whole document matters: a short iframe scrolls
    // internally, and an inner scroll area swallows the touch gesture at its
    // end, which is what made scrolling stick partway down the page.
    //
    // A cross-origin frame's height cannot be read. Google serves the document
    // with a permissive Access-Control-Allow-Origin, so it is fetched and
    // written into the frame instead, which makes the frame same-origin and
    // its height directly measurable -- re-measured on every resize, so the CV
    // can be edited freely and nothing here needs updating. Measuring the
    // frame that is actually on screen (rather than a hidden copy of it, which
    // a mobile browser may lay out differently) is what keeps the frame height
    // and the content in agreement, with no band of empty grey at the end.
    // Writing it in also lets us pin text-size-adjust, which stops phone
    // browsers inflating some blocks and not others -- the reason table text
    // used to render smaller than body text.
    //
    // The markup keeps the plain cross-origin src, so the CV still shows
    // without JavaScript, or if the fetch fails; FALLBACK_HEIGHTS then sizes
    // it. That table goes slightly stale as the CV grows, which shows up as a
    // little extra band above the footer -- never as clipped text, because
    // interpolating this convex curve errs high.
    (function () {
        var DOC_URL      = 'https://docs.google.com/document/d/e/2PACX-1vSY0CfswGIq9QDYlNr8NFALmQNOURObYsEbFiwhuGakpeT5Yy8A8kQ-3izqJJU-oHNhofDVyS-vlrfS/pub?embedded=true';
        var DOC_WIDTH    = 816;   // the document's natural full width
        var DOC_PAD      = 96;    // its own side padding
        var TAIL_PAD     = 72;    // its trailing padding
        var BODY_MARGIN  = 8;     // default body margin inside the frame
        var MIN_PAD      = 16;    // padding still shown at the narrowest sizes
        var MIN_FRAME    = 320;   // frame width at which MIN_PAD applies

        var FALLBACK_HEIGHTS = [
            [276, 17663], [316, 14334], [366, 11704], [416, 10159],
            [466,  9203], [516,  8173], [566,  7474], [624,  6739]
        ];

        var wrap = document.querySelector('.scaled-iframe-wrapper');
        if (!wrap) return;

        var frame = wrap.querySelector('.embed-doc');
        var liveDoc = null;

        // How much of the document's own side padding to show at this frame
        // width: all of it once the frame fits the document, easing down to
        // MIN_PAD on the narrowest screens. The easing is quadratic so that
        // phones, where every pixel of column counts, keep nearly all their
        // width, while anything tablet-sized and up quickly takes on the
        // document's real margins.
        function paddingFor(frameWidth) {
            if (frameWidth >= DOC_WIDTH) return DOC_PAD;
            var t = (frameWidth - MIN_FRAME) / (DOC_WIDTH - MIN_FRAME);
            if (t < 0) t = 0;
            if (t > 1) t = 1;
            return Math.round(MIN_PAD + (DOC_PAD - MIN_PAD) * t * t);
        }

        function fallbackHeight(column) {
            var pts = FALLBACK_HEIGHTS, last = pts.length - 1, i, a = pts[0], b = pts[1];

            if (column >= pts[last][0]) return pts[last][1];

            if (column > pts[0][0]) {
                for (i = 0; i < last; i++) {
                    if (column <= pts[i + 1][0]) { a = pts[i]; b = pts[i + 1]; break; }
                }
            }

            // interpolate (and, below the first point, extrapolate) in 1/column,
            // where the curve is very nearly a straight line
            var xa = 1 / a[0], xb = 1 / b[0], x = 1 / column;
            return a[1] + (x - xa) * (b[1] - a[1]) / (xb - xa);
        }

        function fitDoc() {
            var frameWidth = wrap.getBoundingClientRect().width || DOC_WIDTH;
            var shown      = paddingFor(frameWidth);
            var column     = Math.max(1, Math.round(frameWidth - 2 * shown));

            wrap.style.setProperty('--doc-clip', (DOC_PAD - shown) + 'px');

            var required = null;

            if (liveDoc) {
                // Read the frame's own box first so the width change above is
                // applied before the document's height is measured.
                frame.getBoundingClientRect();
                required = liveDoc.documentElement.scrollHeight - BODY_MARGIN;
                if (required < 1) required = null;
            }

            if (!required) required = fallbackHeight(column);

            // Trim the trailing padding by the same proportion as the sides, so
            // the document's bottom margin matches the ones beside it.
            var tail = Math.round(TAIL_PAD * (shown / DOC_PAD));
            wrap.style.setProperty('--doc-height',
                                   Math.ceil(required - (TAIL_PAD - tail)) + 'px');
        }

        fitDoc();   // lay out immediately from the fallback, then refine
        window.addEventListener('resize', fitDoc);
        window.addEventListener('orientationchange', fitDoc);

        if (!window.fetch) return;

        fetch(DOC_URL, { credentials: 'omit' })
            .then(function (response) {
                if (!response.ok) throw new Error(response.status);
                return response.text();
            })
            .then(function (html) {
                // A fresh frame starts on about:blank, which is same-origin and
                // so can be written to and measured.
                var written = document.createElement('iframe');
                written.className = frame.className;
                written.setAttribute('scrolling', 'no');
                written.setAttribute('title', 'Curriculum Vitae');
                wrap.replaceChild(written, frame);
                frame = written;

                var d = frame.contentDocument;
                d.open();
                d.write(html);
                d.close();

                var base = d.createElement('base');
                base.target = '_blank';          // links leave the frame
                d.head.appendChild(base);

                var pin = d.createElement('style');
                pin.textContent = 'html{-webkit-text-size-adjust:100%;' +
                                  'text-size-adjust:100%}';
                d.head.appendChild(pin);

                liveDoc = d;
                fitDoc();

                // Re-measure once more after the frame has settled.
                window.requestAnimationFrame(fitDoc);
            })
            .catch(function () {
                liveDoc = null;   // keep the cross-origin frame and the table
            });
    })();
    </script>

    <script>
    var coll = document.getElementsByClassName("collapsible");
    var i;

    for (i = 0; i < coll.length; i++) {
      coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.display === "block") {
          content.style.display = "none";
          this.innerHTML = "Read More";
        } else {
          content.style.display = "block";
          this.innerHTML = "Read Less";
        }
      });
    }
    </script>
