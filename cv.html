        <div class="scaled-iframe-wrapper">
            <iframe class="embed-doc" scrolling="no" src="https://docs.google.com/document/d/e/2PACX-1vSY0CfswGIq9QDYlNr8NFALmQNOURObYsEbFiwhuGakpeT5Yy8A8kQ-3izqJJU-oHNhofDVyS-vlrfS/pub?embedded=true"></iframe>

    <script>
    // The document's text column is 624px (468pt); its own 96px side padding
    // is clipped by the wrapper, so 624px is what is actually visible.
    // Below 624px the stylesheet hands the iframe the screen's width and the
    // document reflows into it -- no scaling, so text stays a uniform size on
    // phones. At 624px and above it keeps its natural layout width and is
    // scaled up instead, which enlarges the text rather than padding the
    // frame. The scale is exactly 1 at 624px, so the two regimes meet with no
    // jump; the cap stops it growing past 2x on very large monitors.
    //
    // The iframe is also sized to the whole document. A short iframe scrolls
    // internally, and an inner scroll area swallows the touch gesture once it
    // reaches its end -- that is what made scrolling stick partway down the
    // page. At full height there is no inner scroll region at all.
    //
    // The height of a cross-origin iframe cannot be read, so the document is
    // fetched separately (Google serves it with a permissive
    // Access-Control-Allow-Origin) and written into a hidden same-origin
    // iframe used purely as a measuring stick. Setting that gauge to the same
    // width as the real frame and reading its scrollHeight gives the exact
    // height, re-measured on every resize -- so the CV can be edited freely
    // and nothing here needs updating. The document is plain text with no
    // images or relative URLs, so the clone lays out identically; checked
    // against the real embed it agreed to within 1px at every width.
    //
    // FALLBACK_HEIGHTS is used only if that fetch fails (offline, or Google
    // changing its CORS policy). It goes slightly stale as the CV grows,
    // which shows up as a little extra band above the footer -- never as
    // clipped text, because interpolating this convex curve errs high.
    (function () {
        var DOC_URL     = 'https://docs.google.com/document/d/e/2PACX-1vSY0CfswGIq9QDYlNr8NFALmQNOURObYsEbFiwhuGakpeT5Yy8A8kQ-3izqJJU-oHNhofDVyS-vlrfS/pub?embedded=true';
        var DOC_WIDTH   = 624;   // visible text column, side padding clipped
        var MAX_SCALE   = 2;
        var SIDE_PAD    = 192;   // the document's own 96px of padding, each side
        var TAIL_PAD    = 72;    // its trailing padding, trimmed off the bottom
        var BODY_MARGIN = 8;     // default body margin inside the frame

        var FALLBACK_HEIGHTS = [
            [276, 17663], [316, 14334], [366, 11704], [416, 10159],
            [466,  9203], [516,  8173], [566,  7474], [624,  6739]
        ];

        var wrap = document.querySelector('.scaled-iframe-wrapper');
        if (!wrap) return;

        var gauge = null, gaugeDoc = null;

        function fallbackHeight(column) {
            var pts = FALLBACK_HEIGHTS, last = pts.length - 1, i, a = pts[0], b = pts[1];

            if (column >= pts[last][0]) return pts[last][1];

            if (column > pts[0][0]) {
                for (i = 0; i < last; i++) {
                    if (column <= pts[i + 1][0]) { a = pts[i]; b = pts[i + 1]; break; }
                }
            }

            // interpolate (and, below the first point, extrapolate) in 1/column,
            // where the curve is very nearly a straight line
            var xa = 1 / a[0], xb = 1 / b[0], x = 1 / column;
            return a[1] + (x - xa) * (b[1] - a[1]) / (xb - xa);
        }

        function measuredHeight(column) {
            if (!gaugeDoc) return null;
            gauge.style.width = (column + SIDE_PAD) + 'px';
            var h = gaugeDoc.documentElement.scrollHeight;
            return h ? h - BODY_MARGIN : null;
        }

        function fitDoc() {
            var viewport = document.documentElement.clientWidth;
            var column, scale;

            if (viewport < DOC_WIDTH) {
                column = wrap.getBoundingClientRect().width || viewport;
                scale  = null;                 // reflow regime, stylesheet owns the transform
            } else {
                column = DOC_WIDTH;
                scale  = Math.min(viewport / DOC_WIDTH, MAX_SCALE);
            }

            var required = measuredHeight(column);
            if (!required) required = fallbackHeight(column);

            wrap.style.setProperty('--doc-height', Math.ceil(required - TAIL_PAD) + 'px');

            if (scale === null) {
                wrap.style.removeProperty('--doc-scale');
            } else {
                wrap.style.setProperty('--doc-scale', scale);
            }
        }

        fitDoc();   // lay out immediately from the fallback, then refine
        window.addEventListener('resize', fitDoc);
        window.addEventListener('orientationchange', fitDoc);

        if (!window.fetch) return;

        fetch(DOC_URL, { credentials: 'omit' })
            .then(function (response) {
                if (!response.ok) throw new Error(response.status);
                return response.text();
            })
            .then(function (html) {
                gauge = document.createElement('iframe');
                gauge.setAttribute('aria-hidden', 'true');
                gauge.setAttribute('tabindex', '-1');
                gauge.style.cssText = 'position:absolute;left:-10000px;top:0;' +
                                      'width:816px;height:10px;visibility:hidden;border:0';
                document.body.appendChild(gauge);

                gaugeDoc = gauge.contentDocument;
                gaugeDoc.open();
                gaugeDoc.write(html);
                gaugeDoc.close();

                fitDoc();
            })
            .catch(function () {
                gauge = gaugeDoc = null;   // keep the fallback table
            });
    })();
    </script>

    <script>
    var coll = document.getElementsByClassName("collapsible");
    var i;

    for (i = 0; i < coll.length; i++) {
      coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.display === "block") {
          content.style.display = "none";
          this.innerHTML = "Read More";
        } else {
          content.style.display = "block";
          this.innerHTML = "Read Less";
        }
      });
    }
    </script>
